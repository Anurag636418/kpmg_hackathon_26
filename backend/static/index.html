<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPMG Student Success</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('dashboard'); // 'dashboard', 'list', 'student'
            const [stats, setStats] = useState(null);
            const [students, setStudents] = useState([]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [brief, setBrief] = useState(null);
            const [loading, setLoading] = useState(false);

            const API_BASE = "http://localhost:8000/api";

            useEffect(() => {
                fetchStats();
            }, []);

            const fetchStats = async () => {
                try {
                    const res = await fetch(`${API_BASE}/dashboard`);
                    const data = await res.json();
                    setStats(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchStudents = async (riskLevel = null) => {
                setView('list');
                const url = riskLevel ? `${API_BASE}/students?risk=${riskLevel}` : `${API_BASE}/students`;
                const res = await fetch(url);
                const data = await res.json();
                setStudents(data);
            };

            const viewStudent = async (id) => {
                const res = await fetch(`${API_BASE}/students/${id}`);
                const data = await res.json();
                setSelectedStudent(data);
                setBrief(null);
                setView('student');
            };

            const generateBrief = async () => {
                setLoading(true);
                const res = await fetch(`${API_BASE}/students/intervention`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: selectedStudent.student_id })
                });
                const data = await res.json();
                setBrief(data.brief);
                setLoading(false);
            };

            if (view === 'dashboard' && stats) {
                return (
                    <div className="max-w-6xl mx-auto p-6">
                        <h1 className="text-3xl font-bold mb-8 text-blue-900">College Admin Dashboard</h1>
                        
                        <div className="grid grid-cols-4 gap-4 mb-8">
                            <div className="bg-white p-6 rounded shadow border-t-4 border-blue-500 cursor-pointer" onClick={() => fetchStudents()}>
                                <p className="text-sm text-gray-500 font-bold uppercase">Total Students</p>
                                <p className="text-3xl font-bold">{stats.total_students}</p>
                            </div>
                            <div className="bg-white p-6 rounded shadow border-t-4 border-green-500">
                                <p className="text-sm text-gray-500 font-bold uppercase">Avg Success Score</p>
                                <p className="text-3xl font-bold">{stats.average_success_score}</p>
                            </div>
                            <div className="bg-white p-6 rounded shadow border-t-4 border-red-500 cursor-pointer" onClick={() => fetchStudents('High')}>
                                <p className="text-sm text-gray-500 font-bold uppercase">High Academic Risk</p>
                                <p className="text-3xl font-bold text-red-600">{stats.academic_risk_level.High}</p>
                            </div>
                            <div className="bg-white p-6 rounded shadow border-t-4 border-orange-500 cursor-pointer" onClick={() => fetchStudents('High')}>
                                <p className="text-sm text-gray-500 font-bold uppercase">High Placement Risk</p>
                                <p className="text-3xl font-bold text-orange-600">{stats.placement_risk_level.High}</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded shadow">
                                <h3 className="text-lg font-bold mb-4">Student Segments</h3>
                                {Object.entries(stats.segments).map(([seg, count]) => (
                                    <div key={seg} className="flex justify-between items-center mb-2 p-2 bg-gray-50 rounded">
                                        <span>{seg}</span>
                                        <span className="font-bold">{count}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="bg-white p-6 rounded shadow">
                                <h3 className="text-lg font-bold mb-4">Program Averages</h3>
                                {Object.entries(stats.program_averages).map(([prog, score]) => (
                                    <div key={prog} className="flex justify-between items-center mb-2 p-2 bg-gray-50 rounded">
                                        <span>{prog}</span>
                                        <div className="w-1/2 bg-gray-200 rounded-full h-4">
                                            <div className="bg-blue-600 h-4 rounded-full" style={{width: `${score}%`}}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'list') {
                return (
                    <div className="max-w-6xl mx-auto p-6">
                        <button onClick={() => setView('dashboard')} className="mb-4 text-blue-600 font-bold">&larr; Back to Dashboard</button>
                        <h2 className="text-2xl font-bold mb-4">Student List ({students.length})</h2>
                        <div className="bg-white rounded shadow overflow-hidden">
                            <table className="min-w-full">
                                <thead className="bg-gray-100">
                                    <tr>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Score</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Academic Risk</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Placement Risk</th>
                                        <th className="px-6 py-3"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {students.map(s => (
                                        <tr key={s.student_id} className="border-b">
                                            <td className="px-6 py-4">{s.student_id}</td>
                                            <td className="px-6 py-4 font-bold">{s.student_name}</td>
                                            <td className="px-6 py-4">{s.success_score}</td>
                                            <td className={`px-6 py-4 font-bold ${s.academic_risk_level === 'High' ? 'text-red-600' : ''}`}>{s.academic_risk_level}</td>
                                            <td className={`px-6 py-4 font-bold ${s.placement_risk_level === 'High' ? 'text-orange-600' : ''}`}>{s.placement_risk_level}</td>
                                            <td className="px-6 py-4">
                                                <button onClick={() => viewStudent(s.student_id)} className="bg-blue-100 text-blue-700 px-3 py-1 rounded">View</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            if (view === 'student' && selectedStudent) {
                const s = selectedStudent;
                return (
                    <div className="max-w-4xl mx-auto p-6">
                        <button onClick={() => setView('list')} className="mb-4 text-blue-600 font-bold">&larr; Back to List</button>
                        
                        <div className="bg-white p-8 rounded shadow mb-6">
                            <div className="flex justify-between items-start mb-6">
                                <div>
                                    <h1 className="text-3xl font-bold mb-1">{s.student_name}</h1>
                                    <p className="text-gray-500">{s.student_id} • {s.program} • Year {s.year_of_study}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-sm font-bold text-gray-500 uppercase">Success Score</p>
                                    <p className="text-4xl font-bold text-blue-600">{s.success_score}</p>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div className={`p-4 rounded border ${s.academic_risk_level === 'High' ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200'}`}>
                                    <p className="font-bold">Academic Risk: <span className={s.academic_risk_level === 'High' ? 'text-red-600' : ''}>{s.academic_risk_level}</span></p>
                                    <p className="text-sm">CGPA: {s.cgpa} | Attendance: {s.overall_attendance_percentage}%</p>
                                </div>
                                <div className={`p-4 rounded border ${s.placement_risk_level === 'High' ? 'bg-orange-50 border-orange-200' : 'bg-gray-50 border-gray-200'}`}>
                                    <p className="font-bold">Placement Risk: <span className={s.placement_risk_level === 'High' ? 'text-orange-600' : ''}>{s.placement_risk_level}</span></p>
                                    <p className="text-sm">Coding: {s.coding_score} | Aptitude: {s.aptitude_score}</p>
                                </div>
                            </div>

                            <button 
                                onClick={generateBrief} 
                                disabled={loading}
                                className="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition"
                            >
                                {loading ? 'Generating AI Brief...' : '✨ Generate AI Intervention Brief'}
                            </button>

                            {brief && (
                                <div className="mt-6 p-6 bg-blue-50 border border-blue-200 rounded">
                                    <h3 className="font-bold text-blue-900 mb-2">Generated Action Plan</h3>
                                    <div className="whitespace-pre-wrap text-blue-800">{brief}</div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return <div className="p-10 text-center">Loading...</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
